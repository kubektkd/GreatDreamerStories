plugins {
    id 'java'
    id 'application'
}

group = 'atomiccode'
// version: defined in gradle.properties (canonical for Gradle + scripts + generated GameVersion.java)

ext {
    gdxVersion = '1.14.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        // Keep game assets only on disk (project ./res, or app/res after jpackage).
        // Packaging res into the jar duplicated ~600MB+ in dist (jar + loose copy in stageJpackage).
        resources {
            srcDirs = []
        }
    }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-freetype:${gdxVersion}"

    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-desktop"
}

application {
    mainClass = 'atomiccode.greatDreamerStories.Launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveFileName = 'GreatDreamerStories.jar'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('stageJpackage', Copy) {
    dependsOn jar
    into layout.buildDirectory.dir('jpackage-input')
    from(tasks.jar)
    from(configurations.runtimeClasspath)
    from('res') {
        into 'res'
    }
}

tasks.register('cleanJpackageInput', Delete) {
    delete layout.buildDirectory.dir('jpackage-input')
}

tasks.named('stageJpackage') {
    dependsOn cleanJpackageInput
}

def gameVersionJavaFile = layout.projectDirectory.file('src/atomiccode/greatDreamerStories/GameVersion.java')

tasks.register('writeGameVersionJava') {
    inputs.property('appVersion', version)
    outputs.file(gameVersionJavaFile)
    doLast {
        def v = version.toString().replace('\\', '\\\\').replace('"', '\\"')
        gameVersionJavaFile.asFile.text = """package atomiccode.greatDreamerStories;

/** Synced from Gradle project version (gradle.properties). Regenerated on compile — do not edit. */
public final class GameVersion {
    private GameVersion() {}

    public static final String CURRENT = \"${v}\";
}
"""
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('writeGameVersionJava')
}
