stat.str.desc=Siła fizyczna.\nPomaga przy obezwładnianiu, forsowaniu wejść i walkach w zwarciu.
stat.pow.desc=Wola i nerwy.\nPomaga oprzeć się strachowi, presji i wpływowi okultyzmu.
stat.edu.desc=Wiedza formalna.\nPomaga przy dokumentach, procedurze, badaniach i kontekście eksperckim.
stat.con.desc=Wytrzymałość i zdrowie.\nPomaga przetrwać obrażenia, zmęczenie, trucizny i trudne warunki.
stat.int.desc=Rozumowanie i dedukcja.\nPomaga łączyć tropy, rozwiązywać zagadki i rozumieć motywy.
stat.app.desc=Prezencja i pierwsze wrażenie.\nPomaga w uroku, przesłonięciu i dostępie społecznym.
stat.lck.desc=Szczęście.\nPomaga, gdy zdarzenia są niepewne lub poza bezpośrednią kontrolą.
stat.siz.desc=Masa ciała i zasięg.\nPomaga w zastraszaniu, noszeniu, pchaniu i fizyczności.
stat.dex.desc=Szybkość i precyzja.\nPomaga w skradaniu, broni palnej, unikach i precyzyjnych działaniach.

